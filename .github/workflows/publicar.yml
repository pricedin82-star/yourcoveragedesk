# Your Coverage Desk — carruseles y Reels, automáticos.
#
# Calendario:
#   Lunes, miércoles, viernes  →  carrusel   (banco de p01 hacia adelante)
#   Martes y jueves            →  Reel       (banco de p12 hacia atrás)
#   Lunes por la mañana        →  refrescar el token
#
# Van al revés a propósito: así la misma pieza nunca sale como carrusel y como
# Reel en la misma semana.

name: Publicar carrusel

on:
  schedule:
    - cron: "23 15 * * 1,3,5"   # carrusel, 11:23 ET
    - cron: "23 16 * * 2,4"     # Reel, 12:23 ET
    - cron: "41 13 * * 1"       # refrescar token
  workflow_dispatch:
    inputs:
      formato:
        description: "carrusel o reel"
        required: false
        default: carrusel
        type: choice
        options: [carrusel, reel]
      pieza:
        description: "id de una pieza concreta (opcional)"
        required: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  carrusel:
    if: >-
      github.event.schedule == '23 15 * * 1,3,5' ||
      (github.event_name == 'workflow_dispatch' && inputs.formato == 'carrusel')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet Pillow
      - name: Verificar configuración
        run: python check_setup.py
      - name: Dibujar los slides
        id: build
        run: |
          if [ -n "${{ inputs.pieza }}" ]; then
            python build_carrusel.py --out build --pieza "${{ inputs.pieza }}"
          else
            python build_carrusel.py --out build
          fi
          echo "id=$(python -c "import json;print(json.load(open('build/pieza.json'))['id'])")" >> $GITHUB_OUTPUT
      - name: Subir los slides a una Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="post-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" build/slide_*.jpg --title "$TAG" --notes "carrusel"
          URLS=""
          for f in $(ls build/slide_*.jpg | sort); do
            URLS="$URLS https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename $f)"
          done
          echo "urls=$URLS" >> $GITHUB_OUTPUT
      - name: Publicar en Instagram
        run: python publish_ig.py --urls ${{ steps.release.outputs.urls }} --caption-file build/caption.txt
      - name: Marcar como publicada
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("contenido/estado.json")
          if not p.exists(): p = pathlib.Path("estado.json")
          e = json.loads(p.read_text())
          pid = json.load(open("build/pieza.json"))["id"]
          e.setdefault("publicadas", [])
          if pid not in e["publicadas"]: e["publicadas"].append(pid)
          p.write_text(json.dumps(e, indent=2) + "\n")
          PY
          git config user.name "coverage-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          # SOLO el archivo de estado. Nunca -A: se llevaría el modelo de voz
          # (115 MB) y los archivos de build, y GitHub rechaza el push.
          git add estado.json 2>/dev/null || true
          git add contenido/estado.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "carrusel ${{ steps.build.outputs.id }}"
          git push

  reel:
    if: >-
      github.event.schedule == '23 16 * * 2,4' ||
      (github.event_name == 'workflow_dispatch' && inputs.formato == 'reel')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install --quiet Pillow piper-tts

      # El modelo de voz pesa bastante; se cachea para no bajarlo cada vez.
      - name: Cachear la voz
        id: cache-voz
        uses: actions/cache@v4
        with:
          path: voces
          key: piper-en_US-ryan-high-v1
      - name: Descargar la voz
        if: steps.cache-voz.outputs.cache-hit != 'true'
        run: |
          mkdir -p voces
          python -m piper.download_voices en_US-ryan-high --download-dir voces
          ls -la voces

      - name: Verificar configuración
        run: python check_setup.py

      - name: Construir el Reel
        id: build
        run: |
          VOZ=$(ls voces/*.onnx | head -1)
          echo "usando voz: $VOZ"
          if [ -n "${{ inputs.pieza }}" ]; then
            python build_reel.py --out build_reel --voz "$VOZ" --pieza "${{ inputs.pieza }}"
          else
            python build_reel.py --out build_reel --voz "$VOZ"
          fi
          echo "id=$(python -c "import json;print(json.load(open('build_reel/pieza.json'))['id'])")" >> $GITHUB_OUTPUT

      - name: Subir el video a una Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="reel-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" build_reel/reel.mp4 build_reel/portada.jpg --title "$TAG" --notes "reel"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          echo "video=$BASE/reel.mp4" >> $GITHUB_OUTPUT
          echo "portada=$BASE/portada.jpg" >> $GITHUB_OUTPUT

      - name: Publicar el Reel
        run: |
          python publish_ig.py \
            --reel "${{ steps.release.outputs.video }}" \
            --portada "${{ steps.release.outputs.portada }}" \
            --caption-file build_reel/caption.txt

      - name: Marcar como publicada
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("contenido/estado.json")
          if not p.exists(): p = pathlib.Path("estado.json")
          e = json.loads(p.read_text())
          pid = json.load(open("build_reel/pieza.json"))["id"]
          e.setdefault("publicadas_reel", [])
          if pid not in e["publicadas_reel"]: e["publicadas_reel"].append(pid)
          p.write_text(json.dumps(e, indent=2) + "\n")
          PY
          git config user.name "coverage-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          # SOLO el archivo de estado. Nunca -A.
          git add estado.json 2>/dev/null || true
          git add contenido/estado.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "reel ${{ steps.build.outputs.id }}"
          git push

  refrescar-token:
    if: github.event.schedule == '41 13 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python publish_ig.py --refrescar-token
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
